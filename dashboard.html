<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · ET455 Compassion</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bp:#0B74B8;--bs:#18A6E2;--bd:#0a1628;--bm:#6B8BA0;--bb:#4a6577;--br:#c0392b}*{box-sizing:border-box}body{font-family:Poppins,sans-serif;background:#f0f6fa;color:var(--bd);font-size:14px}.navbar,.topbar{background:#fff;box-shadow:0 2px 18px #0a16280c}.brand{font-weight:800;color:var(--bd);font-size:1.3rem;text-decoration:none}.brand span{color:var(--bp)}.hero{padding:64px 0 48px;text-align:center}.hero-logo{font-size:3.7rem;font-weight:900;letter-spacing:-3px}.hero-logo span{color:var(--bs)}.muted{color:var(--bm)}.btn-primary{background:linear-gradient(135deg,var(--bp),var(--bs));border:0}.btn-primary:hover{filter:brightness(.94)}.card,.panel,.stat{border:0;border-radius:18px;box-shadow:0 4px 20px #0a16280a;background:white}.card{transition:transform .2s}.card:hover{transform:translateY(-3px)}.stat{padding:22px}.stat .num{font-size:2rem;font-weight:800;color:var(--bp)}.iconbox{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:#e5f4fc;color:var(--bp);font-size:1.3rem}.app-shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{background:white;padding:24px 16px;box-shadow:2px 0 15px #0a162808}.sidebar a{display:flex;gap:12px;padding:12px 14px;border-radius:10px;text-decoration:none;color:var(--bb);margin:4px 0}.sidebar a:hover,.sidebar a.active{background:#e8f5fc;color:var(--bp);font-weight:600}.main{min-width:0}.topbar{padding:16px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px}.content{padding:26px}.table thead th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--bm);background:#f8fbfd}.table td,.table th{padding:13px;vertical-align:middle}.badge-status{background:#e5f6ee;color:#168653}.form-control,.form-select{border-radius:10px;padding:10px 12px;border-color:#dce7ed}.form-label{font-weight:600;font-size:12px}.section-title{font-size:1.45rem;font-weight:800}.small-label{font-size:12px;color:var(--bm)}.login-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.login-brand{background:linear-gradient(145deg,#075d99,#18a6e2);color:white;padding:8vw;display:flex;flex-direction:column;justify-content:center}.login-form{display:flex;align-items:center;justify-content:center;padding:32px}.login-box{width:min(460px,100%)}.role-option{border:1px solid #dce7ed;border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer}.role-option:has(input:checked){border-color:var(--bp);background:#eef9ff}.chart-ring{width:155px;height:155px;border-radius:50%;background:conic-gradient(var(--bp) var(--pct),#e9f0f4 0);display:grid;place-items:center;margin:auto}.chart-ring:after{content:attr(data-label);width:110px;height:110px;border-radius:50%;background:white;display:grid;place-items:center;font-weight:800;font-size:1.3rem}@media(max-width:991px){.app-shell{grid-template-columns:1fr}.sidebar{padding:10px;display:flex;flex-wrap:wrap;gap:4px}.sidebar .brand{width:100%;padding:8px}.sidebar a{padding:8px 10px}.content{padding:16px}}@media(max-width:820px){.login-wrap{grid-template-columns:1fr}.login-brand{padding:36px 28px}.hero-logo{font-size:2.7rem}.topbar{padding:12px 16px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}@media print{.sidebar,.topbar,.no-print,button{display:none!important}.app-shell{display:block}.content{padding:0}.card,.panel{box-shadow:none}}
</style></head><body><div class="app-shell"><aside class="sidebar"><a class="brand px-3 mb-4 d-inline-block" href="../index.html">ET <span>455</span></a><a class="active" href="dashboard.html"><i class="fa-solid fa-gauge mt-1"></i>Dashboard</a><a class="" href="children.html"><i class="fa-solid fa-child mt-1"></i>Children</a><a class="" href="users.html"><i class="fa-solid fa-users mt-1"></i>Users</a><a href="../shared/change-pin.html"><i class="fa-solid fa-key mt-1"></i>Change PIN</a><a href="#" id="logout"><i class="fa-solid fa-arrow-right-from-bracket mt-1"></i>Logout</a></aside><main class="main"><div class="topbar"><div><div class="small-label">ET455 COMPASSION / WORKSPACE</div><h1 class="h5 fw-bold mb-0">Dashboard</h1></div><div class="d-flex align-items-center gap-3"><span class="badge rounded-pill text-bg-light px-3 py-2">admin</span><span id="userName" class="fw-semibold"></span></div></div><div class="content"><div class="row g-3 mb-4" id="kpis"></div><div class="row g-4"><div class="col-lg-6"><div class="panel p-4"><h5 class="fw-bold mb-3">System Users</h5><div class="table-responsive"><table class="table"><thead><tr><th>Name</th><th>Role</th><th>Email</th><th>Status</th></tr></thead><tbody id="users"></tbody></table></div></div></div><div class="col-lg-6"><div class="panel p-4"><h5 class="fw-bold mb-3">Recent Screenings</h5><div class="table-responsive"><table class="table"><thead><tr><th>Project ID</th><th>Child</th><th>Date</th><th>Status</th></tr></thead><tbody id="recent"></tbody></table></div></div></div></div></div></main></div><script src="../shared/db.js"></script><script src="../shared/api.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script>const user=ET455.requireRole('admin');if(user)document.getElementById('userName').textContent=user.name;document.getElementById('logout').onclick=e=>{e.preventDefault();ET455.logout()};const s=ET455.stats();document.getElementById('kpis').innerHTML=[['Total Children',s.total,'fa-child'],['Completed',s.completed,'fa-circle-check'],['Pending',s.pending,'fa-clock'],['Emergency',s.emergency,'fa-truck-medical']].map(x=>`<div class="col-6 col-xl-3"><div class="stat"><div class="small-label">${x[0]}</div><div class="num">${x[1]}</div></div></div>`).join('');document.getElementById('users').innerHTML=ET455.getUsers().map(u=>`<tr><td>${ET455.esc(u.name)}</td><td>${u.role}</td><td>${ET455.esc(u.email)}</td><td><span class="badge text-bg-success">${u.status}</span></td></tr>`).join('');document.getElementById('recent').innerHTML=ET455.getScreenings().slice(-8).reverse().map(s=>`<tr><td>${s.projectId}</td><td>${ET455.esc(s.childName)}</td><td>${s.screeningDate}</td><td>${s.status}</td></tr>`).join('');</script></body></html>
