ntent{padding:26px}.table thead th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--bm);background:#f8fbfd}.table td,.table th{padding:13px;vertical-align:middle}.badge-status{background:#e5f6ee;color:#168653}.form-control,.form-select{border-radius:10px;padding:10px 12px;border-color:#dce7ed}.form-label{font-weight:600;font-size:12px}.section-title{font-size:1.45rem;font-weight:800}.small-label{font-size:12px;color:var(--bm)}.login-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.login-brand{background:linear-gradient(145deg,#075d99,#18a6e2);color:white;padding:8vw;display:flex;flex-direction:column;justify-content:center}.login-form{display:flex;align-items:center;justify-content:center;padding:32px}.login-box{width:min(460px,100%)}.role-option{border:1px solid #dce7ed;border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer}.role-option:has(input:checked){border-color:var(--bp);background:#eef9ff}.chart-ring{width:155px;height:155px;border-radius:50%;background:conic-gradient(var(--bp) var(--pct),#e9f0f4 0);display:grid;place-items:center;margin:auto}.chart-ring:after{content:attr(data-label);width:110px;height:110px;border-radius:50%;background:white;display:grid;place-items:center;font-weight:800;font-size:1.3rem}@media(max-width:991px){.app-shell{grid-template-columns:1fr}.sidebar{padding:10px;display:flex;flex-wrap:wrap;gap:4px}.sidebar .brand{width:100%;padding:8px}.sidebar a{padding:8px 10px}.content{padding:16px}}@media(max-width:820px){.login-wrap{grid-template-columns:1fr}.login-brand{padding:36px 28px}.hero-logo{font-size:2.7rem}.topbar{padding:12px 16px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}@media print{.sidebar,.topbar,.no-print,button{display:none!important}.app-shell{display:block}.content{padding:0}.card,.panel{box-shadow:none}}
</style></head><body><nav class="navbar"><div class="container py-2"><a class="brand" href="../index.html">ET <span>455</span> · Compassion</a><a href="../index.html" class="btn btn-outline-secondary">Home</a></div></nav><div class="container py-5"><div class="panel p-4 mx-auto" style="max-width:520px"><h2 class="fw-bold">Change PIN</h2><p class="muted">Update your demo account PIN.</p><form id="form"><label class="form-label">Current PIN</label><input id="old" class="form-control mb-3" type="password" required><label class="form-label">New PIN (4–8 digits)</label><input id="new" class="form-control mb-3" type="password" pattern="[0-9]{4,8}" required><button class="btn btn-primary">Update PIN</button></form><div id="msg" class="mt-3" aria-live="polite"></div></div></div><script src="../shared/db.js"></script><script src="../shared/api.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script>let u=ET455.currentUser();if(!u){location.href='../login.html'}document.getElementById('form').onsubmit=e=>{e.preventDefault();let r=ET455.changePin(u.userId,document.getElementById('old').value,document.getElementById('new').value),m=document.getElementById('msg');m.className=r.ok?'alert alert-success':'alert alert-danger';m.textContent=r.ok?'PIN updated.':'Unable to update PIN: '+r.error};</script></body></html>
